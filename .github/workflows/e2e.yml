name: E2E Tests

# E2E tests are manual-trigger only — they require seed accounts in the
# target DB and may be slow (Playwright + real browser).
# To run automatically on push, change the trigger below.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target app URL'
        required: false
        default: 'https://www.rutauq.online'
        type: string
      environment:
        description: 'Environment label'
        required: false
        default: 'dev'
        type: choice
        options: [dev, staging]

env:
  BASE_URL: ${{ github.event.inputs.base_url || 'https://www.rutauq.online' }}

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rutauq-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: rutauq-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests (chromium only in CI)
        env:
          BASE_URL: ${{ env.BASE_URL }}
          E2E_DRIVER_EMAIL:    ${{ secrets.E2E_DRIVER_EMAIL }}
          E2E_DRIVER_PASSWORD: ${{ secrets.E2E_DRIVER_PASSWORD }}
          E2E_CLIENT_EMAIL:    ${{ secrets.E2E_CLIENT_EMAIL }}
          E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: rutauq-frontend/playwright-report/
          retention-days: 7
